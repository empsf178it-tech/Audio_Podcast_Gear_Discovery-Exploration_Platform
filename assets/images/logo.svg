<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Glowing Hexagonal Vault Shield -->
  <path d="M50 8 L85 27 L85 73 L50 92 L15 73 L15 27 Z" 
        fill="#0B0F12" 
        stroke="url(#logoGlow)" 
        stroke-width="4.5" 
        stroke-linejoin="round"
        filter="url(#glowFilter)"/>

  <!-- Inner Tech Accent Ring -->
  <path d="M50 16 L78 32 L78 68 L50 84 L22 68 L22 32 Z" 
        fill="none" 
        stroke="rgba(34, 211, 238, 0.3)" 
        stroke-width="1.5" 
        stroke-dasharray="6,4"/>

  <!-- Broadcast Mic / Vault Core Icon -->
  <rect x="42" y="28" width="16" height="26" rx="8" fill="url(#cyanGrad)"/>
  
  <!-- Mic Grille Lines -->
  <line x1="44" y1="35" x2="56" y2="35" stroke="#0B0F12" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="40" x2="56" y2="40" stroke="#0B0F12" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Mic U-Bracket -->
  <path d="M35 44 C35 57, 65 57, 65 44" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Mic Stand Stem & Base -->
  <line x1="50" y1="56" x2="50" y2="68" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="68" x2="62" y2="68" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Sound Waves (Equalizer Pulse Sides) -->
  <path d="M27 42 L27 50 M19 44 L19 48" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M73 42 L73 50 M81 44 L81 48" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
</svg>
